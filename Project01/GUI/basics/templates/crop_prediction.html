<!DOCTYPE html>
<html>
<head>
    <title>Crop Recommendation System</title>
    <style>
        body{
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
        }
        .container{
            width: 60%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
        }
        input{
            width: 80%;
            padding: 10px;
            margin: 10px;
        }
        button{
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
        }
        table{
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td{
            border: 1px solid gray;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌾 Crop Recommendation System</h1>

    <form method="post">
        {% csrf_token %}

        <input type="text" name="nitrogen" placeholder="Nitrogen"><br>
        <input type="text" name="phosphorus" placeholder="Phosphorus"><br>
        <input type="text" name="potassium" placeholder="Potassium"><br>
        <input type="text" name="temperature" placeholder="Temperature"><br>
        <input type="text" name="humidity" placeholder="Humidity"><br>
        <input type="text" name="ph" placeholder="pH"><br>
        <input type="text" name="rainfall" placeholder="Rainfall"><br>

        <button type="submit">Predict Crop</button>
    </form>

    {% if result %}
        <h2>Recommended Crop: {{result}}</h2>

        <table>
            <tr>
                <th>Algorithm</th>
                <th>Accuracy</th>
            </tr>
            <tr>
                <td>Logistic Regression</td>
                <td>{{lr_acc}}</td>
            </tr>
            <tr>
                <td>Decision Tree</td>
                <td>{{dt_acc}}</td>
            </tr>
            <tr>
                <td>Random Forest</td>
                <td>{{rf_acc}}</td>
            </tr>
            <tr>
                <td>KNN</td>
                <td>{{knn_acc}}</td>
            </tr>
        </table>
    {% endif %}
</div>

</body>
</html>
